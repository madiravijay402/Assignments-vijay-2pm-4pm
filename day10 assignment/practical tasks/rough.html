<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: rgb(202, 89, 89);
            width: 400px;
            height: 300px;
            position: relative;
            left: 100px;
        }
        .child{
            background-color: antiquewhite;
            width: 100px;
            height: 50px;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            absolute
        </div>
    </div>
</body>
</html>
