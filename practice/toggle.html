<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="mb" style="width: 400px; margin: 0 auto; border: 2px solid black;margin-top: 20px;padding: 30px;">
        <form onsubmit="fc(event)" id="fmm">
            <label for="" class="form-label">email</label>
            <input type="text" name="email" class="form-control">
            <label for="" class="form-label">password</label>
            <input type="password" name="password" class="form-control">
            <button type="submit" class="btn btn-primary" style="margin-top: 5px;" id="bc">login</button>
        </form>
    </div>
    <div id="vs"></div>
    <script>
         let b=document.createElement("div");
        let c=document.getElementById("fmm");
        let d=document.getElementById("vs")
        function fc(e){
            e.preventDefault();
            b.value=c.value;
            d.appendChild(b);
    }
    </script>
</body>
</html>
