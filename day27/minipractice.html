<!DOCTYPE html>
<html>
<head>
  <title>Mini Practice Tasks</title>
</head>
<body>

<h2>Users Emails</h2>
<p id="savedUser"></p>
<ul id="emailList"></ul>

<h2>Geolocation</h2>
<button onclick="getLocation()">Get Location</button>
<p id="location"></p>

<script>
  const emailList = document.getElementById("emailList");
  const savedUserText = document.getElementById("savedUser");

  // 🔹 Retrieve saved user on reload
  const storedName = JSON.parse(localStorage.getItem("userName"));
  if (storedName) {
    savedUserText.textContent = "Saved User: " + storedName;
  }

  // 🔹 Fetch users and display emails
  fetch("https://jsonplaceholder.typicode.com/users")
    .then(res => res.json())
    .then(users => {
      users.forEach(user => {
        const li = document.createElement("li");
        li.textContent = user.email;
        emailList.appendChild(li);
      });

      // 🔹 Save user name in localStorage
      const userObj = { name: users[0].name };
      const jsonData = JSON.stringify(userObj); // object → JSON
      localStorage.setItem("userName", jsonData);

      const parsedData = JSON.parse(jsonData); // JSON → object
      console.log(parsedData.name);
    })
    .catch(err => console.log("Error:", err));

  // 🔹 Geolocation
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById("location").textContent =
          "Latitude: " + pos.coords.latitude +
          " | Longitude: " + pos.coords.longitude;
      });
    } else {
      document.getElementById("location").textContent =
        "Geolocation not supported";
    }
  }
</script>

</body>
</html>
