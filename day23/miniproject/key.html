<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ke">Press any key...</p>

<script>
  const c = document.getElementById("ke");

  document.addEventListener("keydown", (event) => {
    c.innerHTML = `
      Key : ${event.key} <br>
      Key Code : ${event.keyCode}
    `;
  });
</script>
</body>
</html>
