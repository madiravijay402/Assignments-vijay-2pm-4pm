
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">
        name:
        <input type="name" id="ni" name="name">
    </label>
    <label for="">
        email:
        <input type="email" id="em" name="email">
    </label>
    <h2>preview</h2>
    <p id="outn"></p>
    <p id="emout"></p>
    <script>
        const nameInput=document.getElementById("ni");
        const emailinput=document.getElementById("em");
        const name=document.getElementById("outn");
        const email=document.getElementById("emout");
        nameInput.addEventListener("input",()=>{
            name.innerText=nameInput.value;
        })
        emailinput.addEventListener("change",()=>{
            email.innerText=emailinput.value
        })
    </script>
</body>
</html>
