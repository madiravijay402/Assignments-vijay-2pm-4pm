<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Form Preview</title>
</head>
<body>

<h3>Form</h3>
<label>
  Name:
  <input type="text" id="name">
</label><br><br>

<label>
  Email:
  <input type="email" id="email">
</label>

<h3>Live Preview</h3>
<p>Name: <span id="pname"></span></p>
<p>Email: <span id="pemail"></span></p>

<script>
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");

  const pname = document.getElementById("pname");
  const pemail = document.getElementById("pemail");

  // input event → updates while typing
  nameInput.addEventListener("input", () => {
    pname.textContent = nameInput.value;
  });

  // change event → updates after focus out
  emailInput.addEventListener("change", () => {
    pemail.textContent = emailInput.value;
  });
</script>

</body>
</html>
