<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VJEDZ Navbar</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Navbar Background */
    .bge{
      background: linear-gradient(to right, #2e2d56, #7523c7);
    }

    /* Navbar text */
    .ft{
      color: #ffffff !important;
      font-weight: bold;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      text-transform: capitalize;
    }

    /* Logo styling */
    .im{
      width: 70px;
      height: auto;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
      
      mix-blend-mode:multiply;
    }

    /* Hover effect */
    .nav-link:hover{
      color: #d1a8ff !important;
    }
    .ct{
        width: 700px;
        height: 200px;
        margin-top: 100px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg bge">
  <div class="container-fluid">

    <!-- Logo -->
    <img src="Futuristic VJEDZ logo design.png" alt="VJEDZ Logo" class="im">

    <!-- Toggle button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu items -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active ft" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ft" href="#">About Me</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ft" href="#">Skills</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ft" href="#">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link ft" href="#">Contact Me</a>
        </li>
      </ul>
    </div>

  </div>
</nav>
<div class="container bg-info-subtle ct">
  <!-- Content here -->
</div>
<button type="button" class="btn btn-outline-primary"><a href="Madira Vijay resume (2).pdf.pdf" class="nav-link" download="Madira vijay's Resume">resume</a></button>
<button></button>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
