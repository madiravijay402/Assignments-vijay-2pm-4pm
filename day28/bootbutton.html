<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    
    <div class="container">
        <div class="btn-group btn-group-lg">
        <button class="btn btn-outline-secondary  btn-sm" disabled>button</button>
        <button class="btn btn-primary  btn-sm" data-bs-toggle="button">button</button>
        <button class="btn btn-primary btn-link  btn-sm">button</button>
        <a href="#" class="btn btn-outline-dark btn-lg active" data-bs-toggle="button">link</a>
        </div>
    </div>
    <div class="container">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            Alert 
            <a href="#" class="alert-link">go here to find out more</a>
            <button class="btn-close" aria-label="close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
