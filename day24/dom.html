<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .name{
            width: 100px;
            height: 100px;
            border: 2px solid green;
        }
    </style>
</head>
<body> 
    <header class="name">
        vijj
    </header>
    <div class="sam" style="width: 200px; height: 100px; border: 2px solid black;">
        hello world
    </div>
    <ul id="ul">
        vijay
    </ul>
    <button onclick="ck()">add</button>
    <button onclick="remove()">remove</button>
    <script>
        let a=document.getElementsByClassName("name")
        a[0].style.backgroundColor="red"
        let b=document.querySelector(".sam")
        b.style.backgroundColor="green";
        b.style.color="red";
        b.addEventListener("click", () => {
    b.style.backgroundColor = "brown";
  });
        function ck(){
            let c=document.getElementById("ul");
            let d=document.createElement("li")
            d.innerText="its a name";
            c.appendChild(d);
        }
        function remove(){
            let c=document.getElementById("ul");
            if(c.lastElementChild){
                c.removeChild(c.lastElementChild);
            }
        }
    </script>
</body>
</html>
