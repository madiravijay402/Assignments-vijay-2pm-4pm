<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toolbar{
            background-color: rgb(98, 99, 101);
            width: 300px;
            height: 100px;
            padding: 10px;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            gap: 20px;
            position: relative;
        }
        .right{
            float: right;
            right: 10px;
        }
       
    </style>
</head>
<body>
    <div class="toolbar">
        <button type="submit" class="right">home</button>
        <button type="submit" class="center">apply</button>
        <button type="submit" class="left">quit</button>
    </div>
</body>
</html>
