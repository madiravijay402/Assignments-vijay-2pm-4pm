<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f3f4f6;
            border-radius: 6px;
        }

        .toolbar .center {
            flex-grow: 1;
            text-align: center;
        }

        .toolbar .right {
            margin-left: auto;
        }

        .toolbar button {
            padding: 8px 14px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #eef2ff;
        }
    </style>
</head>
<body>
    <h1>Build a toolbar where one button is left, one is centered, and one is right using flex.</h1>
    <div class="toolbar">
        <button type="button" class="left">home</button>
        <button type="button" class="center">apply</button>
        <button type="button" class="right">quit</button>
    </div>
</body>
</html>
