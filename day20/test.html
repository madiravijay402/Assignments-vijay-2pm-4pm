<style>
  .container {
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    height: 200px;
    background: #eee;
  }

  .box {
    background: orange;
    padding: 20px;
    margin: 10px;
  }

  .box1 {
    flex-grow: 1;
  }
  .box2 {
    flex-grow: 2;
    align-self: flex-end;
  }
  .box3 {
    order: 3;
    flex-basis: 150px;
  }
</style>

<div class="container">
  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
  <div class="box box3">Box 3</div>
</div>
