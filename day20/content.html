<!DOCTYPE html>
<html>
<head>
<style>
.container{
  width: 320px;
  border: 2px solid red;
  margin-bottom: 40px;
}

/* content-box (default) */
.box1{
  width: 300px;
  padding: 20px;
  border: 10px solid black;
  background: goldenrod;
  /* box-sizing: content-box; */
}

/* border-box */
.box2{
  width: 300px;
  padding: 20px;
  border: 10px solid black;
  background: lightgreen;
  box-sizing: border-box;
}
</style>
</head>
<body>

<h3>content-box (BREAK)</h3>
<div class="container">
  <div class="box1">content-box</div>
</div>

<h3>border-box (FIX)</h3>
<div class="container">
  <div class="box2">border-box</div>
</div>

</body>
</html>
