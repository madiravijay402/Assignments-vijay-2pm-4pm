<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Toggle</title>
    <style>

        /* Hide the checkbox */
        #menuToggle {
            display: none;
        }

        /* Button (label) */
        .menu-btn {
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid #aaa;
            background: white;
        }

        /* Nav is hidden initially */
        nav {
            display: none;
            background: #eee;
            padding: 10px;
        }

        /* When checkbox is checked, show nav */
        #menuToggle:checked ~ nav {
            display: block;
        }

    </style>
</head>
<body>

    <!-- Hidden Checkbox -->
    <input type="checkbox" id="menuToggle">

    <!-- Button -->
    <label for="menuToggle" class="menu-btn">|||</label>

    <!-- Menu -->
    <nav>
        <a href="">fs</a><br>
        <a href="">python</a><br>
        <a href="">mern</a><br>
        <a href="">java</a><br>
    </nav>

</body>
</html>
