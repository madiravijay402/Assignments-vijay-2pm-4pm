<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fl{
            display: flex;
            background: linear-gradient(to right,#eee,#e24d4d);
            flex-direction: column;
            gap: 20px;
            height: 400px;
        }
        .box{
            background-color: #14a7cc;
            width: 50px;
            height: 40px;
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <h1>Give one flex item its own alignment using align-self.</h1>
    <div class="fl">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box2</div>
    </div>
</body>
</html>
