<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background:linear-gradient(to right,#fff1b0,#e9e07a,#f19748);
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px;
        }
        .box{
            display: flex;
            border: 1px solid whitesmoke;
            background: linear-gradient(to right,#eee,#ffd699);
            width: 30px;
            height: 40px;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
