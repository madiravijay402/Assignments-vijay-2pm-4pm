<!DOCTYPE html>
<html>
<head>
  <style>
    .full-block {
      display: block;      /* block element */
      width: 100%;         /* spans full width */
      background: lightblue;
      padding: 10px;
    }
    .inline-text span {
      display: inline;     /* inline element */
    }
  </style>
</head>
<body>

  <!-- Block element spanning full width -->
  <div class="full-block">
    This is a block element spanning the full width.
  </div>

  <!-- Text with inline element beside it -->
  <p class="inline-text">
    Normal text here
    <span>← this is an inline element beside the text</span>
  </p>

</body>
</html>
