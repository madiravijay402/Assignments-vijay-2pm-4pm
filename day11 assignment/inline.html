<!DOCTYPE html>
<html>
<head>
  <style>
    .full-block {
      display: block;
      width: 100%;         
      background: lightblue;
      padding: 10px;
    }
    .inline-text span {
      display: inline;     
    }
  </style>
</head>
<body>
  

  <div class="full-block">
    This is a block element spanning the full width.
  </div>


  <p class="inline-text">
    Normal text here
    <span>- this is an inline element beside the text</span>
  </p>

</body>
</html>
