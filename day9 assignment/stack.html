<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        div{
            display: flex;
            border: 2px solid #fffeca;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 50px;
            padding: 10px 10px;
            gap: 10px;
            background-color: #fffeca;
        }
    </style>
</head>
<body>
    <h1>Stack three blocks vertically and center them in the viewport using flex.</h1>
    <nav>
        <div>one</div>
        <div>two</div>
        <div>three</div>
    </nav>
</body>
</html>
