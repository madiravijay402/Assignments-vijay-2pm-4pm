<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toolbar{
            display: flex;
            
            
            background-color: #eee;
        }
        .center{
            margin: 0 auto;
        }
        .right{
            margin-right: auto;
        }
        .left{
            margin-left: auto;
        }
        button{
            padding: 8px 14px;
        }
    </style>
</head>
<body>
    <h1>Build a toolbar where one button is left, one is centered, and one is right using flex.</h1><br>
    <div class="toolbar">
    <button class="left">getout</button>
    <button class="center">hi</button>
    <button class="right">vankam</button>
    </div>
</body>
</html>
