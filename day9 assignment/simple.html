<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bar{
            border: 2px solid black;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            padding: 10px;
        }
        .d{
            border: 2px solid red;
            display: flex;
            justify-content: center;
        }
        .cr{
            height: 60px;
            border: 2px solid black;
            background-color: black;
        }
        .cr ul{
            display: flex;
            gap: 10px;
            justify-content: center;
            justify-content: space-between;
        }
        .cr li{
            background-color: rgb(0, 0, 0);
            list-style-type: none;
            
        }
        .cr a{
            color: aliceblue;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
    </style>
    <link rel="stylesheet" href="sm.css">
</head>
<body>
    <h1>1.Create a horizontal navigation where items are centered horizontally and vertically inside a 60px bar.</h1>
    <nav class="bar">
        <div class="d">home</div>
        <div class="d">school</div>
        <div class="d">college</div>
    </nav>
    <nav class="cr">
        <ul>
            <li><a href="#">home</a></li>
            <li><a href="#">library</a></li>
            <li><a href="#">exit</a></li>
        </ul>
    </nav>
    <hr>
</body>
</html>
