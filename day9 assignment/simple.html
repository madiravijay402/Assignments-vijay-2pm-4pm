<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bar{
            border: 2px solid black;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            padding: 10px;
        }
        .d{
            border: 2px solid red;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>Create a horizontal navigation where items are centered horizontally and vertically inside a 60px bar.</h1>
    <nav class="bar">
        <div class="d">home</div>
        <div class="d">school</div>
        <div class="d">college</div>
    </nav>
</body>
</html>
