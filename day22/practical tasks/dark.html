<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            transition: 0.3s;
        }
        .dark{
            background-color: black;
            color: white;
        }
        #bt{
            width: 50px;
            height: 30px;
        }
    </style>
</head>
<body>
   <button id="bt" onclick="dd()">mode</button> 
   <script>
    function dd(){
        document.body.classList.toggle("dark"); 
    }
   </script>
</body>
</html>
