<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cal{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            border: 5px solid black;
            width: 300px;
            height: 400px;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
           border-radius: 5%;
        }
        .disp{
            border: 2px solid black;
            /* background-color: red; */
            grid-column: 1/-1;
            /* width: 200px; */
            /* height: 100px; */
            padding: 5px 5px;
        }
        
       
        .b{
            width: 40px;
            height: 20px;
            border: 1px solid rgb(215, 204, 204);
            box-shadow: 2px 5px 5px;
        }
        button{
            width: inherit;
             background: linear-gradient(to right,#eee,#8fe7e1);
             cursor: pointer;
             transition: filter 200ms ease;
        }
        button:hover{
            filter:brightness(0.9) ;
        }
        .disp input{
            width: 100%;
            height: 100%;
            font-size: 22px;
            padding: 10px;
            box-sizing: border-box;
            text-align: right;
        }
      
    </style>
</head>
<body>
    <div class="cal">
        <div class="disp">
            <input type="text" id="display" readonly>
        </div>
        <div class="b"><button class="bt" data-value="1">1</button></div>
        <div class="b"><button class="bt" data-value="2">2</button></div>
        <div class="b"><button class="bt" data-value="3">3</button></div>
        <div class="b"><button class="bt" data-value="AC">AC</button></div>
        <div class="b"><button class="bt" data-value="4">4</button></div>
        <div class="b"><button class="bt" data-value="5">5</button></div>
        <div class="b"><button class="bt" data-value="6">6</button></div>
        <div class="b"><button class="bt" data-value="*">*</button></div>
        <div class="b"><button class="bt" data-value="7">7</button></div>
        <div class="b"><button class="bt" data-value="8">8</button></div>
        <div class="b"><button class="bt" data-value="9">9</button></div>
        <div class="b"><button class="bt" data-value="/">/</button></div>
        <div class="b"><button class="bt" data-value="0">0</button></div>
        <div class="b"><button class="bt" data-value="+">+</button></div>
        <div class="b"><button class="bt" data-value="-">-</button></div>
        <div class="b"><button class="bt" data-value="%">%</button></div>
    </div>
</body>
</html>
