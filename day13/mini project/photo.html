<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(228, 234, 232);
            height: 500px;
            display: flex;
            justify-content: center;
            justify-content: space-around;
            padding: 20px;
            border-radius: 20px;
        }
        .box{
            border: 2px solid black;
            background-color: rgb(231, 223, 223);
            width: fit-content;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            /* object-fit: cover; */
            align-self: center;
            border-radius: 10px;
        }
        .box .des{
            text-align: center;
            margin-bottom: 0;
            
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box">
        <img src="images.jpg" alt="">
        <div class="des">spider</div>
    </div>
    <div class="box">
        <img src="images (1).jpg" alt="">
        <div class="des">lizard</div>
    </div>
    <div class="box">
        <img src="images (2).jpg" alt="">
        <div class="des">snake</div>
    </div>
    </div>
</body>
</html>
