<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gd{
            border: 2px solid black;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 10px;
            gap: 5px;
        }
        .g1{
             display: flex;
             justify-content: center;
            border: 1px solid blue;
            background-color: #081812;
            transition: background-color 0.5s ease-in, transform 0.3s ease-in;
            
            /* transform: scale(1); */
        }
        .g2{
            display: flex;
            justify-content: center;
            border: 1px solid blue;
        }
        .g1:hover{
            transform: translateY(20px);
            background-color: #0f9bff;
        }
    </style>
</head>
<body>
    <div class="gd">
        <div class="g1">
            <h2 style="color: aliceblue;">Lorem ipsum dolor sit amet.</h2>
        </div>
        <div class="g2">
            <h2>Lorem ipsum dolor sit amet consectetur.</h2>
        </div>
    </div>
</body>
</html>
